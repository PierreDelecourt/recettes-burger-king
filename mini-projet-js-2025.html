<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="fr" lang="fr">

  <head>
    <title> Mini-projet javascript 2025</title>
    <meta charset="UTF-8" />
    <link href="style/style-projet2025.css" type="text/css" rel="stylesheet" />
    <link href="style/style-ajouts.css" type="text/css" rel="stylesheet" />
    <script src="scripts/donnees.js"></script> 
    <script src="scripts/projet2025.js" defer="true"></script> 
    <script src="scripts/test_sory.js" defer="true"></script>
  </head>
  
  <body>
  <!-- la zone avec les 3 images sélectionnées -->
    <div id="selection">
        <div id="title">Choisissez votre top 3</div>
        <div class="choisie" id="choix1">
           <span class="numero">1</span>
        </div>
        <div class="choisie" id="choix2">
           <span class="numero">2</span>
        </div>
        <div class="choisie" id="choix3">
          <span class="numero">3</span>
        </div> 
    </div>

  <!--la zone de texte qui apparaît lors du survol d'une image, par défaut elle sera invisible -->
     <div id="texte">
     </div> 

  <!-- La zone qui comprend les images à sélectionner -->
    <div id="zoneEchantillon">
        <div id="boutons">
            <button id="plus">+</button>  <button id="moins">-</button> 
        </div>  
        <div id="echantillon">
        </div>
    </div>
  </body>
